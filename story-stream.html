<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice: Nexus Prime (Holographic Ambient)</title>
    <style>
        :root {
            --bg-color: #0d0f14;
            --surface-color: #14161e;
            --border-color: #232530;
            --accent-blue: #2563eb;
            --accent-green: #26b226;
            --text-main: #ffffff;
            --text-muted: #4b526d;
            --text-stats: #707793;
            --gold: #d4af37;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .player-console {
            background-color: var(--surface-color);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }
        .voice-mode-indicator {
            background-color: #1a1c23;
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border: 1px solid #282a36;
        }
        .voice-status-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #3b82f6;
            border-radius: 50%;
            box-shadow: 0 0 10px #3b82f6;
            transition: all 0.3s ease;
        }
        .voice-title-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.7px;
            color: #f1f2f6;
            text-transform: uppercase;
        }
        .action-icon-circle {
            width: 32px;
            height: 32px;
            background-color: #282a36;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            color: #ffffff;
            border: none;
            transition: all 0.2s ease;
        }
        .text-display-gate {
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            margin-bottom: 24px;
            overflow: hidden;
            position: relative;
        }
        .display-line {
            font-size: 14px;
            color: var(--text-muted);
            margin: 8px 0;
            opacity: 0.4;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .display-line.active-focus {
            font-size: 16px;
            color: var(--text-main);
            font-weight: 600;
            opacity: 1;
            white-space: normal;
            overflow: visible;
            transform: scale(1.02);
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            text-align: center;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .metric-card {
            border-right: 1px solid var(--border-color);
        }
        .metric-card:last-child {
            border-right: none;
        }
        .metric-label {
            font-size: 11px;
            color: var(--text-stats);
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .metric-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }
        .control-group {
            margin-bottom: 24px;
        }
        .control-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .section-label {
            font-size: 14px;
            font-weight: 600;
            color: #f1f2f6;
        }
        .status-pill-text {
            font-size: 12px;
            color: var(--accent-blue);
            font-weight: 600;
            transition: color 0.3s ease;
        }
        .toggle-switch-dock {
            background-color: var(--bg-color);
            border-radius: 14px;
            padding: 4px;
            display: flex;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .toggle-btn {
            flex: 1;
            background-color: transparent;
            color: var(--text-stats);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .toggle-btn.selected-active {
            background-color: var(--accent-blue);
            color: var(--text-main);
        }
        .voice-selector-box {
            background: #11141a;
            color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            font-family: inherit;
            font-size: 13px;
            margin-top: 8px;
            box-sizing: border-box;
            outline: none;
        }
        .range-slider-track {
            position: relative;
            padding: 12px 0;
            cursor: pointer;
            user-select: none;
        }
        .slider-bar-back {
            height: 4px;
            background-color: var(--border-color);
            border-radius: 2px;
            width: 100%;
        }
        .slider-bar-fill {
            height: 4px;
            background-color: var(--accent-blue);
            border-radius: 2px;
            position: absolute;
            top: 12px;
            left: 0;
            transition: background-color 0.3s ease;
        }
        .slider-handle-thumb {
            width: 16px;
            height: 16px;
            background-color: var(--accent-blue);
            border-radius: 50%;
            position: absolute;
            top: 6px;
            border: 2px solid #ffffff;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
            transform: translateX(-50%);
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="player-console">
        <div class="voice-mode-indicator">
            <div class="voice-status-group">
                <div class="pulse-dot" id="livePulse"></div>
                <div class="voice-title-label" id="activeVoiceLabel">Voice: Nexus Prime</div>
            </div>
            <button class="action-icon-circle" id="masterPlayPauseBtn">▶</button>
        </div>
        <!-- Kinetic Scrolling Node Window Box -->
        <div class="text-display-gate" id="textViewportGate">
            <div class="display-line active-focus" id="lineCurrent">[System Standby: Initiating...]</div>
        </div>

        <!-- Telemetry Tracker Dashboard Grid Row -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Completed</div>
                <div class="metric-value" id="statsProgress">0%</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Remaining</div>
                <div class="metric-value" id="statsLinesLeft">0 lines</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Pace Metric</div>
                <div class="metric-value" id="statsWPM">150 WPM</div>
            </div>
        </div>
        <!-- Mode Dynamic System Grid Section -->
        <div class="control-group">
            <div class="control-header-row">
                <div class="section-label">Audio Matrix Mode</div>
                <div class="status-pill-text" id="statusModeLabel">NARRATION MODE ACTIVE</div>
            </div>
            <div class="toggle-switch-dock">
                <button class="toggle-btn selected-active" id="modeNarrateBtn">Narrator Mode</button>
                <button class="toggle-btn" id="modeScrollBtn">Text Scroll Only</button>
            </div>
        </div>

        <!-- Voice Matrix Profile Ingestion Dropdown Menu Selector -->
        <div class="control-group" id="voiceSelectionContainer">
            <div class="control-header-row">
                <div class="section-label">System Voice Select Profile</div>
            </div>
            <select class="voice-selector-box" id="systemVoiceSelectorGrid">
                <option value="">Ingesting operational local vocal matrix frameworks...</option>
            </select>
        </div>
        <!-- Telemetry Tracker Pacing Matrix Slider Configuration Docks -->
        <div class="control-group">
            <div class="control-header-row">
                <div class="section-label">Pacing Engine Rate Velocity</div>
                <div class="status-pill-text" id="statusSpeedLabelValue">30 Units</div>
            </div>
            <div class="range-slider-track" id="telemetryPaceTrackSlider">
                <div class="slider-bar-back"></div>
                <div class="slider-bar-fill" id="trackSliderFillWidth" style="width: 30%;"></div>
                <div class="slider-handle-thumb" id="trackSliderThumbAnchor" style="left: 30%;"></div>
            </div>
        </div>
    </div>

    <!-- Core Scripting Transmission Pipeline Initialization Layer -->
    <script>
        // ==================================================================================================
        // FAMO NATION DECENTRALIZED DATA CHANNEL MATRIX PIPELINE
        // ==================================================================================================
        const DYNAMIC_RAW_ENDPOINT = 'https://raw.githubusercontent.com/rap1033ssmm-crypto/rap1033ssmm-crypto/main/story.txt';

        // Master Application Working State Variables
        let storyScriptLines = ["[System Data Matrix Standby Initialization]"];
        let currentIdx = 0;
        let isPlaying = false;
        let voiceModeEnabled = false;
        let paceWPM = 174;
        let textSpeedUnits = 30;
        
        // Native Edge Speech Components
        let synth = window.speechSynthesis;
        let voiceArray = [];
        let activeUtterance = null;
        let stepTimer = null;
        // Interface Console Component DOM Selectors
        const masterPlayPauseBtn = document.getElementById('masterPlayPauseBtn');
        const activeVoiceLabel = document.getElementById('activeVoiceLabel');
        const linePrev = document.getElementById('linePrev');
        const lineCurrent = document.getElementById('lineCurrent');
        const lineNext = document.getElementById('lineNext');
        const progressVal = document.getElementById('progressVal');
        const remainingVal = document.getElementById('remainingVal');
        const paceVal = document.getElementById('paceVal');
        const narratorStatusPill = document.getElementById('narratorStatusPill');
        const voiceOffBtn = document.getElementById('voiceOffBtn');
        const voiceActiveBtn = document.getElementById('voiceActiveBtn');
        const systemVoiceSelector = document.getElementById('systemVoiceSelector');
        const speedUnitsLabel = document.getElementById('speedUnitsLabel');
        const sliderTrack = document.getElementById('sliderTrack');
        const sliderFill = document.getElementById('sliderFill');
        const sliderThumb = document.getElementById('sliderThumb');
        const scaleStandardBtn = document.getElementById('scaleStandardBtn');
        const scaleLargeBtn = document.getElementById('scaleLargeBtn');
        const livePulse = document.getElementById('livePulse');
        // ==================================================================================================
        // ASYNCHRONOUS DATA PIPELINE FETCH INGESTION NODE
        // ==================================================================================================
        async function loadDynamicStoryPayload() {
            try {
                const clearEndpoint = 'https://raw.githubusercontent.com/rap1033ssmm-crypto/rap1033ssmm-crypto/main/story.txt';
                lineCurrent.innerText = "Connecting to decentralized data stream registry...";
                
                const response = await fetch(`${clearEndpoint}?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('Data drop offline');
                const rawText = await response.text();
                
                storyScriptLines = rawText.split('\n')
                                          .map(line => line.trim())
                                          .filter(line => line.length > 0);
                                          
                if (storyScriptLines.length === 0) {
                    storyScriptLines = ["[Empty Data Stream File]"];
                }
                
                currentIdx = 0;
                updateDisplayMetrics();
            } catch (error) {
                lineCurrent.innerText = "[Matrix Error: Check story.txt link configuration]";
                console.error(error);
            }
        }
        // ==================================================================================================
        // SYSTEM VOCAL PROFILES MATRIX INGESTION
        // ==================================================================================================
        function populateVocalMatrix() {
            if (!synth) return;
            voiceArray = synth.getVoices();
            systemVoiceSelector.innerHTML = '';
            
            voiceArray.forEach((voice) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.setAttribute('data-name', voice.name);
                systemVoiceSelector.appendChild(option);
            });
            
            if (voiceArray.length > 0) {
                activeVoiceLabel.innerText = "Voice: Native Engine Primed";
            }
        }

        if (synth && synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = populateVocalMatrix;
        }
        populateVocalMatrix();
        // ==================================================================================================
        // TELEMETRY TRACKING CALCULATIONS & METRICS MONITOR
        // ==================================================================================================
        function updateDisplayMetrics() {
            if (storyScriptLines.length === 0) return;
            
            // Track dynamic list index boundaries
            const previousText = currentIdx > 0 ? storyScriptLines[currentIdx - 1] : "---";
            const currentText = storyScriptLines[currentIdx];
            const nextText = currentIdx < storyScriptLines.length - 1 ? storyScriptLines[currentIdx + 1] : "---";
            
            // Push texts directly into the UI viewport element blocks
                        lineCurrent.innerText = currentText;

            
            // Calculate ledger percentage ratios
            const progress = Math.round(((currentIdx + 1) / storyScriptLines.length) * 100);
            const linesRemaining = storyScriptLines.length - (currentIdx + 1);
            
            progressVal.innerText = `${progress}%`;
            remainingVal.innerText = `${linesRemaining} lines`;
            paceVal.innerText = `${paceWPM} WPM`;
        }
        // ==================================================================================================
        // STEP SEQUENCE AUTOMATION ENGINE
        // ==================================================================================================
        function executeNextPipelineStep() {
            if (currentIdx >= storyScriptLines.length) {
                currentIdx = 0;
                toggleExecutionState(false);
                updateDisplayMetrics();
                return;
            }

            updateDisplayMetrics();
            const currentLineText = storyScriptLines[currentIdx];

            if (voiceModeEnabled && synth) {
                synth.cancel();
                activeUtterance = new SpeechSynthesisUtterance(currentLineText);
                
                const selectedOption = systemVoiceSelector.selectedOptions[0];
                if (selectedOption) {
                    const voiceName = selectedOption.getAttribute('data-name');
                    const matchedVoice = voiceArray.find(v => v.name === voiceName);
                    if (matchedVoice) activeUtterance.voice = matchedVoice;
                }

                activeUtterance.rate = textSpeedUnits / 30;

                activeUtterance.onend = function() {
                    if (isPlaying) {
                        currentIdx++;
                        executeNextPipelineStep();
                    }
                };

                activeUtterance.onerror = function() {
                    clearTimeout(stepTimer);
                    stepTimer = setTimeout(() => {
                        if (isPlaying) advanceIndexStep();
                    }, 2000);
                };

                synth.speak(activeUtterance);
            } else {
                const wordCount = currentLineText.split(/\s+/).length;
                const scrollingDelay = Math.max(2000, (wordCount / paceWPM) * 60000);
                
                clearTimeout(stepTimer);
                stepTimer = setTimeout(() => {
                    if (isPlaying) advanceIndexStep();
                }, scrollingDelay);
            }
        }

        function advanceIndexStep() {
            currentIdx++;
            executeNextPipelineStep();
        }
        // ==================================================================================================
        // STATE EXECUTION CONTROLLERS & PLAYBACK TOGGLES
        // ==================================================================================================
              function toggleExecutionState(forceState) {
            isPlaying = forceState !== undefined ? forceState : !isPlaying;

            if (isPlaying) {
                masterPlayPauseBtn.innerText = "❚❚";
                masterPlayPauseBtn.style.backgroundColor = "var(--accent-green)";
                if (livePulse) {
                    livePulse.style.backgroundColor = "var(--accent-green)";
                    livePulse.style.boxShadow = "0 0 10px var(--accent-green)";
                }
                executeNextPipelineStep();
            } else {
                masterPlayPauseBtn.innerText = "▶";
                masterPlayPauseBtn.style.backgroundColor = "var(--accent-blue)";
                if (livePulse) {
                    livePulse.style.backgroundColor = "var(--accent-blue)";
                    livePulse.style.boxShadow = "0 0 10px var(--accent-blue)";
                }
                clearTimeout(stepTimer);
                if (synth) synth.cancel();
            }
        }

        masterPlayPauseBtn.addEventListener('click', () => toggleExecutionState());
        // ==================================================================================================
        // SOVEREIGN INITIALIZATION MATRIX TRIGGER
        // ==================================================================================================
        // Boots the network ingestion data channel automatically on layout load
        window.addEventListener('DOMContentLoaded', () => {
                        loadDynamicStoryPayload();

        });
    </script>
</body>
</html>
